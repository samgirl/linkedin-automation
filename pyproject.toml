[project]
name = "ai-content-radar"
version = "1.0.0"
description = "AI-powered LinkedIn engagement tool - discover discussions, rank opportunities, generate thoughtful comments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AI Content Radar"}
]
dependencies = [
    "streamlit>=1.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.1.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
browser = [
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
content-radar = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100
